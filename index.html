<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Opening Anki</title>
<style>
  :root{--bg:#fcf8f5;--ink:#2f2a2c;--muted:#8f8589;--accent:#d9768c;--accent-ink:#fff}
  @media (prefers-color-scheme:dark){:root{--bg:#1b1719;--ink:#f3ecee;--muted:#a69a9f;--accent:#ee9aac;--accent-ink:#1b1719}}
  body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--bg);color:var(--ink);font:400 18px/1.4 system-ui,sans-serif;padding:24px;text-align:center}
  .box{display:grid;gap:14px;max-width:340px}
  a{display:block;text-decoration:none;font-weight:700;background:var(--accent);color:var(--accent-ink);border-radius:14px;padding:16px}
  p{margin:0;color:var(--muted);font-size:15px}
</style>
</head>
<body>
<div class="box">
  <b id="deck">Opening Anki…</b>
  <a id="go" href="anki://">Open in Anki</a>
  <p>If Anki didn't open, tap the button.</p>
  <a id="alt" href="#" style="background:none;color:var(--muted);font-weight:400;text-decoration:underline;padding:4px" hidden>Deck didn't open? Show its cards instead</a>
</div>
<script>
  // ?deck=Full::Deck::Name  → phone: AnkiMobile search for that deck; Mac: the local "Open Anki Deck" helper.
  var deck = new URLSearchParams(location.search).get("deck") || "";
  var ios = /iPhone|iPad|iPod/.test(navigator.userAgent) || (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);
  var url;
  // iPhone: AnkiMobile 25.07+ "study" link opens the deck itself; the search link (Browse) stays as a fallback button.
  var search = "anki://x-callback-url/search?query=" + encodeURIComponent('"deck:' + deck + '"');
  if (ios) url = deck && deck !== "MCATalyst MCAT" ? "anki://x-callback-url/study?deck=" + encodeURIComponent(deck) : "anki://";
  else url = "ankideck://open?deck=" + encodeURIComponent(deck || "MCATalyst MCAT");
  document.getElementById("deck").textContent = deck ? deck.split("::").pop() : "Anki";
  document.getElementById("go").href = url;
  if (ios && deck && deck !== "MCATalyst MCAT") { var alt = document.getElementById("alt"); alt.href = search; alt.hidden = false; }
  location.href = url;
</script>
</body>
</html>
